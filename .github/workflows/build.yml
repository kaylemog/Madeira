name: Build Madeira iPhone 13 (4GB RAM) IPA for MiSide



on:

  push:

  workflow_dispatch:



jobs:

  build-ipa:

    runs-on: macos-15

    timeout-minutes: 90



    steps:

      - name: Checkout Madeira Repository & Submodules

        uses: actions/checkout@v4

        with:

          submodules: recursive

          fetch-depth: 1



      - name: Patch Entitlements & Inject iPhone 13 Memory Watchdog

        run: |

          set -e

          echo "[*] Repository structure:"

          ls -la

          [ -d "./app" ] && ls -la ./app || true

          [ -d "./build" ] && ls -la ./build || true



          # 1. Create fallback entitlements file and patch any existing .entitlements in repo

          cat << 'EOF' > "${GITHUB_WORKSPACE}/Madeira_iPhone13_Optimized.entitlements"

          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>get-task-allow</key>

              <true/>

              <key>com.apple.developer.kernel.increased-memory-limit</key>

              <true/>

              <key>com.apple.developer.kernel.extended-virtual-addressing</key>

              <true/>

          </dict>

          </plist>

          EOF



          find . -maxdepth 4 -name "*.entitlements" | while read -r ENT_FILE; do

            echo "[*] Patching entitlements file: ${ENT_FILE}"

            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.increased-memory-limit bool true" "${ENT_FILE}" 2>/dev/null || \

            /usr/libexec/PlistBuddy -c "Set :com.apple.developer.kernel.increased-memory-limit true" "${ENT_FILE}" || true

            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.extended-virtual-addressing bool true" "${ENT_FILE}" 2>/dev/null || \

            /usr/libexec/PlistBuddy -c "Set :com.apple.developer.kernel.extended-virtual-addressing true" "${ENT_FILE}" || true

            /usr/libexec/PlistBuddy -c "Add :get-task-allow bool true" "${ENT_FILE}" 2>/dev/null || \

            /usr/libexec/PlistBuddy -c "Set :get-task-allow true" "${ENT_FILE}" || true

          done



          # 2. Inject pure-C iOS Jetsam Watchdog & Low-RAM Env Vars into an existing C/ObjC source in app/

          TARGET_SRC=$(find ./app -maxdepth 4 \( -name "*.m" -o -name "*.c" \) | head -n 1 || true)

          if [ -n "${TARGET_SRC}" ]; then

            echo "[*] Injecting iPhone 13 Jetsam watchdog constructor into: ${TARGET_SRC}"

            cat << 'EOF' >> "${TARGET_SRC}"



          /* === iPhone 13 (4GB RAM) MiSide Optimization & Jetsam Watchdog === */

          #include <stdlib.h>

          #include <stddef.h>

          #include <unistd.h>

          #include <pthread.h>



          extern size_t os_proc_available_memory(void) __attribute__((weak_import));

          extern void malloc_zone_pressure_relief(void *zone, size_t goal) __attribute__((weak_import));

          extern void rpmalloc_thread_collect(void) __attribute__((weak_import));



          static void *madeira_iphone13_watchdog_thread(void *arg) {

              (void)arg;

              const size_t low_mem_bytes = 240ULL * 1024ULL * 1024ULL;

              while (1) {

                  sleep(1);

                  if (os_proc_available_memory != NULL) {

                      size_t avail = os_proc_available_memory();

                      if (avail > 0 && avail < low_mem_bytes) {

                          if (rpmalloc_thread_collect != NULL) {

                              rpmalloc_thread_collect();

                          }

                          if (malloc_zone_pressure_relief != NULL) {

                              malloc_zone_pressure_relief(NULL, 0);

                          }

                      }

                  }

              }

              return NULL;

          }



          __attribute__((constructor))

          static void madeira_iphone13_init_env(void) {

              setenv("FEX_MAXINST", "500", 0);

              setenv("FEX_MULTIBLOCK", "0", 0);

              setenv("FEX_TSOENABLED", "1", 0);

              setenv("FEX_VECTORTSOENABLED", "0", 0);

              setenv("FEX_MEMCPYSETTSOENABLED", "0", 0);

              setenv("FEX_HALFBARRIERTSOENABLED", "1", 0);

              setenv("DXMT_CONFIG", "d3d11.preferredMaxFrameRate=30;d3d11.maxFrameLatency=1;", 0);

              setenv("MTL_HUD_ENABLED", "0", 0);

              setenv("MTL_SHADER_VALIDATION", "0", 0);

              setenv("WINEDEBUG", "-all", 0);

              setenv("WINEDLLOVERRIDES", "winemenubuilder.exe=d;mscoree=d;mshtml=d;d3d11=n,b;dxgi=n,b", 0);



              pthread_t tid;

              pthread_create(&tid, NULL, madeira_iphone13_watchdog_thread, NULL);

              pthread_detach(tid);

          }

          EOF

          else

            echo "[*] No .c/.m file found in ./app; will inject LSEnvironment into Info.plist after build."

          fi



      - name: Build iOS App via Xcode

        run: |

          set -e

          XCODEPROJ=$(find . -maxdepth 4 -name "*.xcodeproj" | head -n 1 || true)

          if [ -z "${XCODEPROJ}" ]; then

            echo "[!] No .xcodeproj found yet; checking for project.yml or build scripts..."

            find . -maxdepth 3 -ls

            exit 1

          fi



          SCHEME=$(xcodebuild -project "${XCODEPROJ}" -list | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')

          echo "[*] Found Xcode project: ${XCODEPROJ} (Scheme: ${SCHEME})"



          xcodebuild \

            -project "${XCODEPROJ}" \

            -scheme "${SCHEME}" \

            -configuration Release \

            -sdk iphoneos \

            -derivedDataPath "${GITHUB_WORKSPACE}/build_derived" \

            ARCHS="arm64" \

            ONLY_ACTIVE_ARCH=YES \

            CODE_SIGNING_ALLOWED=NO \

            CODE_SIGNING_REQUIRED=NO \

            CODE_SIGN_IDENTITY="" \

            ENABLE_BITCODE=NO



      - name: Package IPA & MiSide Low-RAM Configs

        run: |

          set -e

          mkdir -p "${GITHUB_WORKSPACE}/output_bundle"

          APP_PATH=$(find "${GITHUB_WORKSPACE}/build_derived" -name "*.app" -type d | grep -v "\.xcarchive" | head -n 1 || true)



          if [ -z "${APP_PATH}" ]; then

            echo "[!] Could not find built .app in build_derived"

            exit 1

          fi



          echo "[*] Found built app at: ${APP_PATH}"

          INFO_PLIST="${APP_PATH}/Info.plist"

          if [ -f "${INFO_PLIST}" ]; then

            /usr/libexec/PlistBuddy -c "Add :LSEnvironment dict" "${INFO_PLIST}" 2>/dev/null || true

            /usr/libexec/PlistBuddy -c "Add :LSEnvironment:FEX_MAXINST string 500" "${INFO_PLIST}" 2>/dev/null || true

            /usr/libexec/PlistBuddy -c "Add :LSEnvironment:FEX_MULTIBLOCK string 0" "${INFO_PLIST}" 2>/dev/null || true

            /usr/libexec/PlistBuddy -c "Add :LSEnvironment:FEX_VECTORTSOENABLED string 0" "${INFO_PLIST}" 2>/dev/null || true

            /usr/libexec/PlistBuddy -c "Add :LSEnvironment:DXMT_CONFIG string d3d11.preferredMaxFrameRate=30;d3d11.maxFrameLatency=1;" "${INFO_PLIST}" 2>/dev/null || true

            /usr/libexec/PlistBuddy -c "Add :LSEnvironment:WINEDEBUG string -all" "${INFO_PLIST}" 2>/dev/null || true

          fi



          mkdir -p "${GITHUB_WORKSPACE}/output_bundle/Payload"

          cp -R "${APP_PATH}" "${GITHUB_WORKSPACE}/output_bundle/Payload/"

          APP_NAME=$(basename "${APP_PATH}")

          cp "${GITHUB_WORKSPACE}/Madeira_iPhone13_Optimized.entitlements" \

             "${GITHUB_WORKSPACE}/output_bundle/Payload/${APP_NAME}/archived-expanded-entitlements.xcent"



          cd "${GITHUB_WORKSPACE}/output_bundle"

          zip -r9 Madeira-iPhone13-Optimized.ipa Payload

          rm -rf Payload



          cat << 'EOF' > "${GITHUB_WORKSPACE}/output_bundle/boot.config"

          gfx-enable-gfx-jobs=0

          gfx-enable-native-gfx-jobs=0

          gc-max-time-slice=2

          hdr-display-enabled=0

          vr-enabled=0

          wait-for-native-debugger=0

          EOF



          cp "${GITHUB_WORKSPACE}/Madeira_iPhone13_Optimized.entitlements" \

             "${GITHUB_WORKSPACE}/output_bundle/Madeira_iPhone13_Optimized.entitlements"



      - name: Upload Optimized IPA & MiSide Config Artifact

        uses: actions/upload-artifact@v4

        with:

          name: Madeira-iPhone13-MiSide-Bundle

          path: ${{ github.workspace }}/output_bundle/*

          retention-days: 30
