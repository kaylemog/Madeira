name: Build Madeira iPhone 13 (4GB RAM) IPA for MiSide



on:

  push:

  workflow_dispatch:



jobs:

  build-ipa:

    runs-on: macos-15

    timeout-minutes: 120



    steps:

      - name: Checkout Madeira Repository & Submodules

        uses: actions/checkout@v4

        with:

          submodules: recursive

          fetch-depth: 1



      - name: Install Build Dependencies via Homebrew

        run: |

          brew update

          brew install cmake ninja pkg-config llvm mingw-w64 nasm python3 xcodegen || true



      - name: Generate iPhone 13 (4GB) Entitlements (Increased RAM + Extended Virtual Addressing)

        run: |

          cat << 'EOF' > "${GITHUB_WORKSPACE}/Madeira_iPhone13_Optimized.entitlements"

          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>get-task-allow</key>

              <true/>

              <key>com.apple.developer.kernel.increased-memory-limit</key>

              <true/>

              <key>com.apple.developer.kernel.extended-virtual-addressing</key>

              <true/>

          </dict>

          </plist>

          EOF



      - name: Compile iOS Jetsam Memory Watchdog & Low-RAM Default Env Vars

        run: |

          cat << 'EOF' > "${GITHUB_WORKSPACE}/MadeiraMemoryWatchdog.m"

          #import <Foundation/Foundation.h>

          #import <UIKit/UIKit.h>

          #include <os/proc.h>

          #include <malloc/malloc.h>

          #include <stdlib.h>



          extern void rpmalloc_thread_collect(void) __attribute__((weak_import));



          static dispatch_source_t gWatchdogTimer = nil;

          static const size_t kLowMemBytes = 240ULL * 1024ULL * 1024ULL;



          static void MadeiraTrimMemory(void) {

              if (rpmalloc_thread_collect != NULL) {

                  rpmalloc_thread_collect();

              }

              malloc_zone_pressure_relief(NULL, 0);

          }



          __attribute__((constructor))

          static void MadeiraInitiPhone13Optimizations(void) {

              setenv("FEX_MAXINST", "500", 0);

              setenv("FEX_MULTIBLOCK", "0", 0);

              setenv("FEX_TSOENABLED", "1", 0);

              setenv("FEX_VECTORTSOENABLED", "0", 0);

              setenv("FEX_MEMCPYSETTSOENABLED", "0", 0);

              setenv("FEX_HALFBARRIERTSOENABLED", "1", 0);

              setenv("DXMT_CONFIG", "d3d11.preferredMaxFrameRate=30;d3d11.maxFrameLatency=1;", 0);

              setenv("MTL_HUD_ENABLED", "0", 0);

              setenv("MTL_SHADER_VALIDATION", "0", 0);

              setenv("WINEDEBUG", "-all", 0);

              setenv("WINEDLLOVERRIDES", "winemenubuilder.exe=d;mscoree=d;mshtml=d;d3d11=n,b;dxgi=n,b", 0);



              dispatch_queue_t q = dispatch_get_global_queue(QOS_CLASS_UTILITY, 0);

              gWatchdogTimer = dispatch_source_create(DISPATCH_SOURCE_TYPE_TIMER, 0, 0, q);

              dispatch_source_set_timer(gWatchdogTimer,

                                        dispatch_time(DISPATCH_TIME_NOW, 1 * NSEC_PER_SEC),

                                        1 * NSEC_PER_SEC,

                                        100 * NSEC_PER_MSEC);

              dispatch_source_set_event_handler(gWatchdogTimer, ^{

                  size_t avail = os_proc_available_memory();

                  if (avail > 0 && avail < kLowMemBytes) {

                      MadeiraTrimMemory();

                  }

              });

              dispatch_resume(gWatchdogTimer);



              [[NSNotificationCenter defaultCenter]

                  addObserverForName:UIApplicationDidReceiveMemoryWarningNotification

                              object:nil

                               queue:nil

                          usingBlock:^(__unused NSNotification *n) {

                              MadeiraTrimMemory();

                          }];

          }

          EOF



          xcrun -sdk iphoneos clang -arch arm64 -Os -fobjc-arc \

            -c "${GITHUB_WORKSPACE}/MadeiraMemoryWatchdog.m" \

            -o "${GITHUB_WORKSPACE}/MadeiraMemoryWatchdog.o"

          xcrun ar rcs "${GITHUB_WORKSPACE}/libMadeiraWatchdog.a" "${GITHUB_WORKSPACE}/MadeiraMemoryWatchdog.o"



      - name: Build Native Components & iOS App

        run: |

          set -e

          echo "[*] Inspecting repository structure..."

          ls -la



          # 1. Run top-level or build/ directory build script if present

          if [ -f "./build.sh" ]; then

            chmod +x ./build.sh

            CFLAGS="-O2 -flto=thin" CXXFLAGS="-O2 -flto=thin" ./build.sh

          elif [ -f "./build/build.sh" ]; then

            chmod +x ./build/build.sh

            CFLAGS="-O2 -flto=thin" CXXFLAGS="-O2 -flto=thin" ./build/build.sh

          fi



          # 2. If XcodeGen project.yml is used inside app/ or root, generate .xcodeproj

          PROJECT_YML=$(find . -maxdepth 3 -name "project.yml" | head -n 1 || true)

          if [ -n "${PROJECT_YML}" ] && [ -z "$(find . -maxdepth 3 -name '*.xcodeproj' | head -n 1)" ]; then

            pushd "$(dirname "${PROJECT_YML}")"

            xcodegen generate

            popd

          fi



          # 3. Locate .xcodeproj in root or app/ directory and build Release .app

          XCODEPROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1 || true)

          if [ -n "${XCODEPROJ}" ]; then

            SCHEME=$(xcodebuild -project "${XCODEPROJ}" -list | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')

            echo "[*] Building ${XCODEPROJ} (Scheme: ${SCHEME})..."

            xcodebuild \

              -project "${XCODEPROJ}" \

              -scheme "${SCHEME}" \

              -configuration Release \

              -sdk iphoneos \

              -derivedDataPath "${GITHUB_WORKSPACE}/build_derived" \

              ARCHS="arm64" \

              ONLY_ACTIVE_ARCH=YES \

              CODE_SIGN_ENTITLEMENTS="${GITHUB_WORKSPACE}/Madeira_iPhone13_Optimized.entitlements" \

              CODE_SIGNING_ALLOWED=NO \

              CODE_SIGNING_REQUIRED=NO \

              CODE_SIGN_IDENTITY="" \

              GCC_OPTIMIZATION_LEVEL=s \

              SWIFT_OPTIMIZATION_LEVEL="-Osize" \

              OTHER_LDFLAGS="\$(inherited) -force_load ${GITHUB_WORKSPACE}/libMadeiraWatchdog.a" \

              ENABLE_BITCODE=NO

          fi



      - name: Package IPA & MiSide Low-RAM Configs

        run: |

          mkdir -p "${GITHUB_WORKSPACE}/output_bundle"

          APP_PATH=$(find "${GITHUB_WORKSPACE}" -name "*.app" -type d | grep -v "\.xcarchive" | head -n 1 || true)



          if [ -n "${APP_PATH}" ]; then

            mkdir -p "${GITHUB_WORKSPACE}/output_bundle/Payload"

            cp -R "${APP_PATH}" "${GITHUB_WORKSPACE}/output_bundle/Payload/"

            APP_NAME=$(basename "${APP_PATH}")

            cp "${GITHUB_WORKSPACE}/Madeira_iPhone13_Optimized.entitlements" \

               "${GITHUB_WORKSPACE}/output_bundle/Payload/${APP_NAME}/archived-expanded-entitlements.xcent"



            cd "${GITHUB_WORKSPACE}/output_bundle"

            zip -r9 Madeira-iPhone13-Optimized.ipa Payload

            rm -rf Payload

          else

            # Check if build script already produced an .ipa directly

            EXISTING_IPA=$(find "${GITHUB_WORKSPACE}" -name "*.ipa" -type f | head -n 1 || true)

            if [ -n "${EXISTING_IPA}" ]; then

              cp "${EXISTING_IPA}" "${GITHUB_WORKSPACE}/output_bundle/Madeira-iPhone13-Optimized.ipa"

            fi

          fi



          cat << 'EOF' > "${GITHUB_WORKSPACE}/output_bundle/boot.config"

          gfx-enable-gfx-jobs=0

          gfx-enable-native-gfx-jobs=0

          gc-max-time-slice=2

          hdr-display-enabled=0

          vr-enabled=0

          wait-for-native-debugger=0

          EOF



          cp "${GITHUB_WORKSPACE}/Madeira_iPhone13_Optimized.entitlements" \

             "${GITHUB_WORKSPACE}/output_bundle/Madeira_iPhone13_Optimized.entitlements"



      - name: Upload Optimized IPA & MiSide Config Artifact

        uses: actions/upload-artifact@v4

        with:

          name: Madeira-iPhone13-MiSide-Bundle

          path: ${{ github.workspace }}/output_bundle/*

          retention-days: 30
